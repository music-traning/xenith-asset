<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" fill="none">
  <rect width="640" height="360" rx="16" fill="#020617"/>
  <rect x="1" y="1" width="638" height="358" rx="15" stroke="#334155" stroke-opacity="0.5"/>
  <!-- Subtle architectural blueprint grid -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="128" y1="0" x2="128" y2="360"/>
    <line x1="256" y1="0" x2="256" y2="360"/>
    <line x1="384" y1="0" x2="384" y2="360"/>
    <line x1="512" y1="0" x2="512" y2="360"/>
  </g>
  <!-- Ambient Champagne Gold Glow -->
  <circle cx="320" cy="180" r="160" fill="url(#ambientGold)" fill-opacity="0.22"/>
  <!-- Architectural Luxury RC Building Elevation -->
  <g stroke="#C6A87C" stroke-width="1.5">
    <rect x="150" y="64" width="340" height="236" fill="#0f172a" fill-opacity="0.85"/>
    <line x1="150" y1="112" x2="490" y2="112" stroke-opacity="0.6"/>
    <line x1="150" y1="160" x2="490" y2="160" stroke-opacity="0.6"/>
    <line x1="150" y1="208" x2="490" y2="208" stroke-opacity="0.6"/>
    <line x1="150" y1="256" x2="490" y2="256" stroke-opacity="0.6"/>
    <line x1="260" y1="64" x2="260" y2="300" stroke-opacity="0.5"/>
    <line x1="380" y1="64" x2="380" y2="300" stroke-opacity="0.5"/>
  </g>
  <!-- Illuminated Penthouse & Louvers -->
  <rect x="166" y="76" width="80" height="24" fill="#E0CFA7" fill-opacity="0.25" stroke="#E0CFA7" stroke-width="0.75"/>
  <rect x="274" y="76" width="92" height="24" fill="#E0CFA7" fill-opacity="0.35" stroke="#E0CFA7" stroke-width="0.75"/>
  <rect x="394" y="76" width="80" height="24" fill="#E0CFA7" fill-opacity="0.2" stroke="#E0CFA7" stroke-width="0.75"/>
  <rect x="166" y="124" width="80" height="24" fill="#C6A87C" fill-opacity="0.18"/>
  <rect x="274" y="124" width="92" height="24" fill="#C6A87C" fill-opacity="0.28"/>
  <rect x="394" y="124" width="80" height="24" fill="#C6A87C" fill-opacity="0.15"/>
  <rect x="166" y="172" width="80" height="24" fill="#C6A87C" fill-opacity="0.15"/>
  <rect x="274" y="172" width="92" height="24" fill="#C6A87C" fill-opacity="0.22"/>
  <rect x="394" y="172" width="80" height="24" fill="#C6A87C" fill-opacity="0.25"/>
  <!-- Ground Line -->
  <line x1="90" y1="300" x2="550" y2="300" stroke="#E0CFA7" stroke-width="2"/>
  <defs>
    <radialGradient id="ambientGold" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 180) rotate(90) scale(160)">
      <stop stop-color="#C6A87C"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
